<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>매크로 투자 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', sans-serif;
      padding: 24px;
    }
    .header { margin-bottom: 24px; }
    .header h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .header p  { font-size: 13px; color: #666; }

    /* 카드 */
    .cards {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 16px 18px;
    }
    .card .label { font-size: 12px; color: #888; margin-bottom: 6px; }
    .card .value { font-size: 22px; font-weight: 700; color: #fff; }
    .card .change { font-size: 12px; margin-top: 5px; }
    .up   { color: #ef5350; }
    .down { color: #26a69a; }
    .neu  { color: #888; }

    /* 차트 */
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .chart-box {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 20px;
    }
    .chart-box.full { grid-column: 1 / -1; }
    .chart-title { font-size: 14px; font-weight: 600; color: #ccc; margin-bottom: 14px; }

    /* 해석 가이드 */
    .guide {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 20px 24px;
    }
    .guide h2 { font-size: 14px; color: #aaa; margin-bottom: 14px; }
    .guide-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .guide-item {
      background: #0f1117;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.7;
      color: #bbb;
      border-left: 3px solid #444;
    }
    .guide-item strong { display: block; color: #fff; margin-bottom: 4px; font-size: 13px; }
    .tag-tga  { border-left-color: #42a5f5; }
    .tag-rate { border-left-color: #ef5350; }
    .tag-fx   { border-left-color: #ab47bc; }
    .tag-hy   { border-left-color: #ef5350; }
    .tag-wti  { border-left-color: #ffa726; }

    .update-note { text-align: right; font-size: 11px; color: #555; margin-top: 14px; }
  </style>
</head>

  <p>매일 시장 개장 전 체크하는 핵심 매크로 지표</p>
</div>
